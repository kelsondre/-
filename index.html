            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff3e3e, #ff8a3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        .quote-box {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #ff3e3e;
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 0 8px 8px 0;

        }
        
        .quote {
            font-size: 1.3rem;
            font-style: italic;
            margin-bottom: 0.5rem;
            color: #f1f1f1;
        }
        
        .author {
            font-weight: bold;
            color: #ff3e3e;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .social-links {
            margin-top: 2rem;
        }
        
        .social-links a {
            color: white;
            margin: 0 10px;
            font-size: 1.5rem;
